name: pedidos

x-api: &api
  build: ./backend
  restart: unless-stopped
  environment: &api-env
    DB_HOSTS: db-primary,db-replica
    DB_NAME: ${POSTGRES_DB:-pedidos}
    DB_USER: ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-pedidos_pw}
    PEERS: http://api1:8000,http://api2:8000
  depends_on:
    db-primary: { condition: service_healthy }
    db-replica: { condition: service_healthy }

services:
  db-primary:
    image: postgres:16
    container_name: db-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidos_pw}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_pw}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10",
              "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    volumes:
      - pg_primary:/var/lib/postgresql/data
      - ./base_de_datos/primary:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      red: { ipv4_address: 172.28.0.10 }

  db-replica:
    image: postgres:16
    container_name: db-replica
    restart: unless-stopped
    environment:
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_pw}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    volumes:
      - pg_replica:/var/lib/postgresql/data
      - ./base_de_datos/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports: ["5433:5432"]
    depends_on:
      db-primary: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      red: { ipv4_address: 172.28.0.11 }

  api1:
    <<: *api
    container_name: api1
    environment:
      <<: *api-env
      NODE_ID: api1
    networks:
      red: { ipv4_address: 172.28.0.21 }

  api2:
    <<: *api
    container_name: api2
    environment:
      <<: *api-env
      NODE_ID: api2
    networks:
      red: { ipv4_address: 172.28.0.22 }

  gateway:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
    networks:
      red: { ipv4_address: 172.28.0.30 }

volumes:
  pg_primary:
  pg_replica:

networks:
  red:
    ipam:
      config:
        - subnet: 172.28.0.0/24
