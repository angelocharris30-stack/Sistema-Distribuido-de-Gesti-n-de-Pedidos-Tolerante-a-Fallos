# Balanceador de carga + servidor del frontend
upstream api_nodes {
    # round-robin por defecto; si un nodo falla 1 vez se aparta 5 s
    server api1:8000 max_fails=1 fail_timeout=5s;
    server api2:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        # Si el nodo no responde, reintenta en el otro.
        # (No se incluye http_503: es la respuesta legítima "BD no disponible".)
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
